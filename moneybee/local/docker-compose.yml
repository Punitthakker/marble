# MoneyBee Compliance - local Docker setup
#
#   ./setup.sh          (first time only: creates .env and secrets/)
#   docker compose up -d
#
# Then open http://localhost:3737. The first screen creates your organisation and admin login.
#
# Login uses the Firebase Auth emulator (free, runs in Docker, local use only). It is reached as
# auth.localtest.me, a public name that always points to your own computer (127.0.0.1). Inside
# Docker the same name points at the emulator, so the browser and the app use one address.
# OIDC/SSO login is a Marble Enterprise licence feature, so it is not used here.
#
# Port already in use? Add APP_PORT=xxxx to .env, then: docker compose up -d

name: moneybee-compliance

x-backend-image: &backend-image
  image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:${MARBLE_VERSION:-v1.11.0}
  platform: linux/amd64

x-backend-env: &backend-env
  ENV: production
  PG_HOSTNAME: db
  PG_PORT: "5432"
  PG_USER: postgres
  PG_PASSWORD: ${PG_PASSWORD}
  PG_SSL_MODE: disable
  MARBLE_APP_URL: http://localhost:${APP_PORT:-3737}
  AUTHENTICATION_JWT_SIGNING_KEY_FILE: /secrets/jwt.pem
  AUTH_PROVIDER: firebase
  FIREBASE_AUTH_EMULATOR_HOST: auth.localtest.me:9099
  FIREBASE_PROJECT_ID: test-project
  FIREBASE_API_KEY: local-emulator
  INGESTION_BUCKET_URL: file:///data/ingestion?create_dir=true&no_tmp_dir=true
  CASE_MANAGER_BUCKET_URL: file:///data/case-manager?create_dir=true&no_tmp_dir=true
  ANALYTICS_BUCKET_URL: file:///data/analytics?create_dir=true&no_tmp_dir=true
  REDIS_HOST: redis:6379
  DISABLE_SEGMENT: "true"
  DISABLE_TELEMETRY: "true"

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: marble
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  auth:
    # Firebase Auth emulator published by the Marble team (same image as their dev setup)
    image: europe-west1-docker.pkg.dev/marble-infra/marble/firebase-emulator:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9099:9099"
    volumes:
      - auth-data:/app/firebase-local-data
    networks:
      default:
        aliases:
          - auth.localtest.me

  migrations:
    <<: *backend-image
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app", "--migrations"]
    environment:
      <<: *backend-env
    volumes:
      - ./secrets:/secrets:ro

  api:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      auth:
        condition: service_started
      redis:
        condition: service_started
    entrypoint: ["/app", "--server"]
    environment:
      <<: *backend-env
    # Not published to your computer: the app reaches the API inside Docker.
    # To call the API from your machine, add:  ports: ["${API_PORT:-8081}:8080"]
    volumes:
      - ./secrets:/secrets:ro
      - files:/data

  worker:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: ["/app", "--worker"]
    environment:
      <<: *backend-env
    volumes:
      - ./secrets:/secrets:ro
      - files:/data

  app:
    build:
      context: ../..
      dockerfile: moneybee/Dockerfile.front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      ENV: production
      MARBLE_API_URL: http://api:8080
      TEST_FIREBASE_AUTH_EMULATOR_HOST: auth.localtest.me:9099
      SESSION_SECRET: ${SESSION_SECRET}
      DISABLE_SEGMENT: "true"
    ports:
      - "${APP_PORT:-3737}:8080"

volumes:
  db-data:
  auth-data:
  files:

# MoneyBee Compliance - local Docker setup
#
#   ./setup.sh          (first time only: creates .env and secrets/)
#   docker compose up -d
#
# Then open http://localhost:3000 and sign in with the email and password printed by setup.sh.
#
# The login service is reached as dex.localtest.me, a public name that always points to your own
# computer (127.0.0.1). Inside Docker the same name points at the login container, so the
# browser and the app use one address.

name: moneybee-compliance

x-backend-image: &backend-image
  image: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:${MARBLE_VERSION:-v1.11.0}
  platform: linux/amd64

x-backend-env: &backend-env
  ENV: production
  PG_HOSTNAME: db
  PG_PORT: "5432"
  PG_USER: postgres
  PG_PASSWORD: ${PG_PASSWORD}
  PG_SSL_MODE: disable
  MARBLE_APP_URL: http://localhost:3000
  AUTHENTICATION_JWT_SIGNING_KEY_FILE: /secrets/jwt.pem
  AUTH_PROVIDER: oidc
  AUTH_OIDC_ISSUER: http://dex.localtest.me:5556
  AUTH_OIDC_CLIENT_ID: moneybee-compliance
  AUTH_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
  AUTH_OIDC_SCOPE: openid,email,profile,offline_access
  CREATE_ORG_NAME: MoneyBee
  CREATE_ORG_ADMIN_EMAIL: ${ADMIN_EMAIL}
  INGESTION_BUCKET_URL: file:///data/ingestion?create_dir=true
  CASE_MANAGER_BUCKET_URL: file:///data/case-manager?create_dir=true
  ANALYTICS_BUCKET_URL: file:///data/analytics?create_dir=true
  REDIS_HOST: redis:6379
  DISABLE_SEGMENT: "true"
  DISABLE_TELEMETRY: "true"

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: marble
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  dex:
    build:
      context: ../..
      dockerfile: moneybee/dex/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5556"
      DEX_ISSUER: http://dex.localtest.me:5556
      DEX_REDIRECT_URI: http://localhost:3000/oidc/callback
      DEX_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEX_ADMIN_EMAIL: ${ADMIN_EMAIL}
      DEX_ADMIN_HASH: ${ADMIN_PASSWORD_HASH}
    ports:
      - "5556:5556"
    volumes:
      - dex-data:/var/dex
    networks:
      default:
        aliases:
          - dex.localtest.me

  migrations:
    <<: *backend-image
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app", "--migrations"]
    environment:
      <<: *backend-env
    volumes:
      - ./secrets:/secrets:ro

  api:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      dex:
        condition: service_started
      redis:
        condition: service_started
    entrypoint: ["/app", "--server"]
    environment:
      <<: *backend-env
    # Not published to your computer: the app reaches the API inside Docker.
    # To call the API from your machine, add:  ports: ["${API_PORT:-8081}:8080"]
    volumes:
      - ./secrets:/secrets:ro
      - files:/data

  worker:
    <<: *backend-image
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    entrypoint: ["/app", "--worker"]
    environment:
      <<: *backend-env
    volumes:
      - ./secrets:/secrets:ro
      - files:/data

  app:
    build:
      context: ../..
      dockerfile: moneybee/Dockerfile.front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      ENV: production
      MARBLE_API_URL: http://api:8080
      SESSION_SECRET: ${SESSION_SECRET}
      DISABLE_SEGMENT: "true"
    ports:
      - "3000:8080"

volumes:
  db-data:
  dex-data:
  files:
